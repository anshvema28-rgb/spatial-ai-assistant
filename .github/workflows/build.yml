name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake \
            patchelf

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0

      - name: Cache Buildozer artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/buildozer
            ~/.cache/buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK
        run: |
          buildozer -v android ${{ github.event.inputs.build_type || 'debug' }}
        env:
          # GROQ_API_KEY is NOT needed at build time.
          # The app reads it at runtime via os.getenv().
          # Do NOT pass secrets to the build.

      - name: Verify APK exists
        run: |
          ls -la bin/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spatial-ai-assistant-${{ github.event.inputs.build_type || 'debug' }}
          path: bin/*.apk
          retention-days: 30

      - name: Show APK info
        run: |
          for apk in bin/*.apk; do
            echo "=== $apk ==="
            unzip -l "$apk" | head -30
          done